name: Deploy Abbate website to ALL-INKL

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "downloads.json"
      - "dist/**"
      - "android/**"
      - "capacitor.config.json"
      - "tests/**"
      - "scripts/build-web.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-allinkl.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: abbate-allinkl-website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: abbate-pilot
    steps:
      - name: Check out website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and test
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify real certificate PDFs with synthetic data
        run: |
          npm install --no-save --package-lock=false --ignore-scripts pdf-lib@1.17.1
          node scripts/verify-certificate-pdfs.cjs

      - name: Assemble public website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website
          cp index.html downloads.json theorie-katalog.html website/
          cp -a dist website/dist
          test -s website/index.html
          test -s website/theorie-katalog.html
          test -s website/dist/theorie-katalog.html
          test -s website/dist/konto.html
          test -s website/dist/portal.js
          test -s website/dist/backend-config.js
          test -s website/dist/vendor/supabase.js

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build or retain the verified live Android installer
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ABBATE_ANDROID_KEYSTORE_BASE64 }}
          ABBATE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ABBATE_ANDROID_KEYSTORE_PASSWORD }}
          ABBATE_ANDROID_KEY_ALIAS: ${{ secrets.ABBATE_ANDROID_KEY_ALIAS }}
          ABBATE_ANDROID_KEY_PASSWORD: ${{ secrets.ABBATE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p website/downloads
          apk='website/downloads/Abbate-Lernraum-Android.apk'
          meta='website/downloads/android-live.json'
          base='https://app.gabelstaplerfahrschule-andreas.de/downloads'
          # Preserve the installed package/signature on ordinary web deployments.
          if curl -fsSL --max-time 30 "$base/android-live.json" -o "$meta" &&
             curl -fsSL --max-time 90 "$base/Abbate-Lernraum-Android.apk" -o "$apk" &&
             node -e 'const fs=require("fs"),c=require("crypto"),m=JSON.parse(fs.readFileSync(process.argv[1]));if(m.versionCode!==2||m.sha256!==c.createHash("sha256").update(fs.readFileSync(process.argv[2])).digest("hex"))process.exit(1)' "$meta" "$apk"; then
            echo 'Existing verified live Android installer retained.'
          else
            npm exec -- cap sync android
            chmod +x android/gradlew
            if [ -n "$KEYSTORE_BASE64" ] && [ -n "$ABBATE_ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ABBATE_ANDROID_KEY_ALIAS" ] && [ -n "$ABBATE_ANDROID_KEY_PASSWORD" ]; then
              export ABBATE_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/abbate-upload.jks"
              printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ABBATE_ANDROID_KEYSTORE_PATH"
              chmod 600 "$ABBATE_ANDROID_KEYSTORE_PATH"
              (cd android && ./gradlew --no-daemon assembleRelease)
              cp android/app/build/outputs/apk/release/app-release.apk "$apk"
              rm -f "$ABBATE_ANDROID_KEYSTORE_PATH"
            else
              echo '::warning::No permanent Android signing key configured; publishing a debug-signed pilot only.'
              (cd android && ./gradlew --no-daemon assembleDebug)
              cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
            fi
            node -e 'const fs=require("fs"),c=require("crypto");fs.writeFileSync(process.argv[1],JSON.stringify({versionCode:2,sha256:c.createHash("sha256").update(fs.readFileSync(process.argv[2])).digest("hex"),liveFrontend:true})+"\\n")' "$meta" "$apk"
          fi
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          signer=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)
          aapt=$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -1)
          "$signer" verify --verbose "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='de.abbate.lernraum.preview' versionCode='2'"
          test -s "$meta"

      - name: Stamp every public app page with the exact deployed revision
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const sha=process.env.GITHUB_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Invalid SHA');
          fs.writeFileSync('website/dist/build-info.json',JSON.stringify({commit:sha,publishedAt:new Date().toISOString()})+'\n');
          for(const page of ['index.html','konto.html','nachweise.html','verwaltung.html']){
            const file='website/dist/'+page,html=fs.readFileSync(file,'utf8');
            if(!html.includes('<head>')||!html.includes('</head>'))throw Error('Missing head '+page);
            const script='<script defer src="./frontend-updates.js?v='+sha.slice(0,12)+'"></script>';
            fs.writeFileSync(file,html.replace('<head>','<head><meta name="abbate-build" content="'+sha+'">').replace('</head>',script+'</head>'));
          }
          NODE


      - name: Upload distributable bundle for manual fallback
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abbate-allinkl-webspace-package
          path: website/
          if-no-files-found: error
          retention-days: 14

      - name: Verify dedicated FTP account settings
        shell: bash
        env:
          FTP_HOST: ${{ secrets.ABBATE_FTPS_HOST }}
          FTP_USER: ${{ secrets.ABBATE_FTPS_USER }}
          FTP_PASSWORD: ${{ secrets.ABBATE_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"
          case "$FTP_HOST" in *[!a-zA-Z0-9.-]*|'') echo 'Invalid FTP hostname' >&2; exit 1;; esac
          # The dedicated ALL-INKL account is restricted in KAS to
          # /gabelstaplerfahrschule-andreas.de/abbate-app/.
          # Therefore its FTP '/' IS that directory, not the hosting root.
          # Never use the account of the main website or an unrestricted FTP user.

      - name: Secure FTPS upload to ALL-INKL (explicit TLS, no remote delete)
        shell: bash
        env:
          FTP_HOST: ${{ secrets.ABBATE_FTPS_HOST }}
          FTP_USER: ${{ secrets.ABBATE_FTPS_USER }}
          LFTP_PASSWORD: ${{ secrets.ABBATE_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Credentials are passed using environment variables, never interpolated
          # directly into shell commands or committed to the repository.
          lftp <<LFTP_SCRIPT
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set cmd:fail-exit true
          set net:max-retries 3
          set net:timeout 25
          open --env-password --user "$FTP_USER" "ftp://$FTP_HOST"
          # The FTP user's '/' maps to the app directory configured in KAS.
          # This command intentionally does not delete any remote files.
          mirror --reverse --verbose=1 --transfer-all --no-perms --parallel=2 website /
          bye
          LFTP_SCRIPT

      - name: Verify real HTTPS publication instead of trusting FTP exit status
        shell: bash
        run: |
          set -euo pipefail
          base='https://app.gabelstaplerfahrschule-andreas.de/dist'
          curl -fsSL --retry 3 --retry-delay 2 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "$base/build-info.json?sha=$GITHUB_SHA" -o live-build-info.json
          node -e "const j=require('./live-build-info.json');if(j.commit!==process.env.GITHUB_SHA)process.exit(1)"
          curl -fsSL --retry 3 --max-time 90 'https://app.gabelstaplerfahrschule-andreas.de/downloads/Abbate-Lernraum-Android.apk' -o live-android.apk
          cmp -s website/downloads/Abbate-Lernraum-Android.apk live-android.apk
          curl -fsSL --retry 3 --max-time 20 "https://app.gabelstaplerfahrschule-andreas.de/downloads/android-live.json?sha=$GITHUB_SHA" -o live-android-meta.json
          cmp -s website/downloads/android-live.json live-android-meta.json
          curl -fsSL --retry 3 --max-time 20 'https://app.gabelstaplerfahrschule-andreas.de/?sha='$GITHUB_SHA -o live-landing.html
          cmp -s website/index.html live-landing.html
          for file in index.html konto.html pruefung.html app.js sw.js verwaltung.html admin-workspace.css nachweise.html portal.js frontend-updates.js; do
            curl -fsSL --retry 3 --retry-delay 2 --max-time 20 \
              -H 'Cache-Control: no-cache' "$base/$file?sha=$GITHUB_SHA" -o "live-$file"
            cmp -s "website/dist/$file" "live-$file" || { echo "::error::Live $file does not match the release"; exit 1; }
          done



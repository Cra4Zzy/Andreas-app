name: Check Abbate private-repository migration

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/desktop-updates.yml"
      - ".github/workflows/verify-private-repo-migration.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Run application and desktop updater regression tests
        run: npm test

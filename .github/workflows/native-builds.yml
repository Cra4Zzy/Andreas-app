name: Native pilot builds
on:
  push:
    branches: [main, feature/live-backend]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - run: chmod +x android/gradlew
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - name: Compile unsigned release AAB for Play preflight (NOT uploadable)
        run: ./gradlew --no-daemon bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abbate-android-pilot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run native:sync
      - run: xcodebuild -version
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Verify device Release archive compiles without distribution signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath ios-build/Abbate-Lernraum-Unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - run: ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app ios-build/Abbate-Simulator.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abbate-ios-simulator
          path: ios-build/Abbate-Simulator.zip
          retention-days: 14

name: Validate learning content and exam UI
on:
  pull_request:
    branches: [main]
    paths:
      - "dist/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/question-expansion-ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

name: Prepare signed TestFlight IPA (manual)

on:
  workflow_dispatch:
    inputs:
      confirmed_internal_test:
        description: "Prepare a signed IPA for authorized TestFlight testing; no automatic upload"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  ios-testflight:
    if: inputs.confirmed_internal_test
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ vars.ABBATE_APPLE_TEAM_ID }}
      APPLE_PROFILE_NAME: ${{ vars.ABBATE_APPLE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Block temporary preview app IDs
        run: node scripts/check-mobile-release-id.cjs
      - name: Check Xcode and Apple team settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_PROFILE_NAME"
      - name: Import private Apple Distribution certificate and provisioning profile
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.ABBATE_IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.ABBATE_IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.ABBATE_IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERT_BASE64"
          test -n "$CERT_PASSWORD"
          test -n "$PROFILE_BASE64"
          cert="$RUNNER_TEMP/abbate-distribution.p12"
          profile="$RUNNER_TEMP/abbate-appstore.mobileprovision"
          printf '%s' "$CERT_BASE64" | base64 -D > "$cert"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$profile"
          chmod 600 "$cert" "$profile"
          keychain="$RUNNER_TEMP/abbate-build.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"
          security cms -D -i "$profile" > "$RUNNER_TEMP/abbate-profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/abbate-profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
      - name: Synchronize iOS native resources
        run: npm run native:sync
      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Abbate-Lernraum.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROFILE_NAME" \
            archive
      - name: Export signed IPA for manually authorized TestFlight upload
        shell: bash
        run: |
          set -euo pipefail
          app_id="$(node -p "require('./capacitor.config.json').appId")"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>$app_id</key><string>$APPLE_PROFILE_NAME</string></dict>
          <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Abbate-Lernraum.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/testflight-export"
          test -n "$(find "$RUNNER_TEMP/testflight-export" -type f -name '*.ipa' -print -quit)"
          mkdir -p release
          cp "$RUNNER_TEMP/testflight-export/"*.ipa release/Abbate-Lernraum-TestFlight.ipa
      - name: Archive the signed IPA without submitting it to Apple
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abbate-signed-ios-testflight-ipa
          path: release/Abbate-Lernraum-TestFlight.ipa
          if-no-files-found: error
          retention-days: 7

name: Generate Abbate question translations
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-practice-translations.cjs"
      - ".github/workflows/generate-practice-translations.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abbate-question-translations
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify translation service and question segmentation
        env:
          TRANSLATE_SMOKE: "1"
          TRANSLATE_WORKERS: "2"
        run: node scripts/generate-practice-translations.cjs en
      - name: Generate every supported language
        env:
          TRANSLATE_WORKERS: "6"
        run: node scripts/generate-practice-translations.cjs
      - name: Validate exact translated-question coverage
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const languages=['uk','ru','cs','bg','hr','da','nl','en','et','fi','fr','el','hu','ga','it','lv','lt','mt','pl','pt','ro','sk','sl','es','sv'];
          for(const lang of languages){
            const ctx={};ctx.globalThis=ctx;
            vm.runInNewContext(fs.readFileSync('dist/practice-translations/'+lang+'.js','utf8'),ctx);
            const pack=ctx.ABBATE_QUESTION_TRANSLATIONS?.[lang];
            if(!pack || Object.keys(pack).length!==250)throw Error('Incomplete locale: '+lang);
            for(const fields of Object.values(pack))if(!Array.isArray(fields)||fields.length!==6||fields.some(s=>typeof s!=='string'||s.length<3))throw Error('Corrupt locale: '+lang);
          }
          console.log('250 exercises including answer options in all 25 locales verified');
          NODE
      - name: Publish translation data to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/practice-translations/
          git diff --cached --quiet && exit 0
          git commit -m 'i18n: publish complete machine translations for all graded practice questions'
          git push origin HEAD:main

name: Abbate desktop updater (free key, no paid certificates)

# Publishing remains explicitly manual. Main-branch pushes compile signed verification artifacts,
# but must never publish an update manifest or a user-facing release.
on:
  workflow_dispatch:
  # Compile and sign an internal test artifact automatically; publish stays manual.
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/prepare-desktop-updater-config.cjs"
      - "scripts/make-desktop-update-feed.cjs"
      - "tests/desktop-updater.test.cjs"
      - ".github/workflows/desktop-updates.yml"

permissions:
  contents: read

concurrency:
  # An older manual release must not block CI verification of a new fix.
  group: ${{ github.event_name == 'workflow_dispatch' && 'abbate-desktop-stable-release' || 'abbate-desktop-ci-verification' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Require only the free cryptographic Tauri updater key pair
        shell: bash
        env:
          ABBATE_UPDATER_PUBLIC_KEY: ${{ vars.ABBATE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for key in ABBATE_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required signing or notarization setting: $key"
              exit 1
            fi
          done
          # Never print any signing key to the build log.
      - id: version
        name: Verify intended app version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.stable.conf.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad release version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing signed desktop version $version"
      - name: Run all unit and release checks
        run: |
          npm ci
          npm test

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal Mac targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install frontend dependencies and run checks
        run: |
          npm ci
          npm test
      - name: Generate Tauri updater configuration from stored public key
        env:
          ABBATE_UPDATER_PUBLIC_KEY: ${{ vars.ABBATE_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-desktop-updater-config.cjs
      - name: Prepare the official Abbate desktop icon
        run: npx --yes @tauri-apps/cli@2.12.4 icon dist/icon-512.png --output src-tauri/icons
      - name: Build signed Windows installer and updater signature
        if: runner.os == 'Windows'
        shell: bash
        env:
          ABBATE_UPDATER_PUBLIC_KEY: ${{ vars.ABBATE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis --features desktop-auto-update --config src-tauri/tauri.stable.generated.conf.json --ci
      - name: Build universal Mac app without paid Apple certificates
        if: runner.os == 'macOS'
        shell: bash
        env:
          ABBATE_UPDATER_PUBLIC_KEY: ${{ vars.ABBATE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          set -euo pipefail
          npx --yes @tauri-apps/cli@2.12.4 build --bundles app,dmg --target universal-apple-darwin --features desktop-auto-update --config src-tauri/tauri.stable.generated.conf.json --ci
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -s "$dmg"
          # Tauri update archive is signed using the free updater key.
          # macOS may still display Gatekeeper warnings for the unsigned DMG.
      - name: Stage signed Windows assets
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          file="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -s "$file"
          test -s "$file.sig"
          mkdir -p release
          cp "$file" release/Abbate-Lernraum-Windows-Setup.exe
          cp "$file.sig" release/Abbate-Lernraum-Windows-Setup.exe.sig
      - name: Stage unsigned Mac installer and signed update archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg="$(find "$root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          archive="$(find "$root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -s "$dmg"
          test -s "$archive"
          test -s "$archive.sig"
          mkdir -p release
          cp "$dmg" release/Abbate-Lernraum-macOS-Universal.dmg
          cp "$archive" release/Abbate-Lernraum-macOS-Universal.app.tar.gz
          cp "$archive.sig" release/Abbate-Lernraum-macOS-Universal.app.tar.gz.sig
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abbate-signed-${{ matrix.platform }}-${{ needs.preflight.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight,build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: abbate-signed-windows-${{ env.RELEASE_VERSION }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: abbate-signed-macos-${{ env.RELEASE_VERSION }}
          path: release
      - name: Verify all files and generate static updater feed
        shell: bash
        run: |
          set -euo pipefail
          node scripts/make-desktop-update-feed.cjs
          node -e "const j=require('./release/latest.json'); if(j.version!==process.env.RELEASE_VERSION) process.exit(1)"
      - name: Publish immutable versioned binaries before announcing the update
        shell: bash
        run: |
          set -euo pipefail
          tag="desktop-v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Version $tag was already published. Bump src-tauri/tauri.stable.conf.json for the next release."
            exit 1
          fi
          gh release create "$tag" \
            release/Abbate-Lernraum-Windows-Setup.exe \
            release/Abbate-Lernraum-Windows-Setup.exe.sig \
            release/Abbate-Lernraum-macOS-Universal.dmg \
            release/Abbate-Lernraum-macOS-Universal.app.tar.gz \
            release/Abbate-Lernraum-macOS-Universal.app.tar.gz.sig \
            --target "$GITHUB_SHA" --title "Abbate Lernraum Desktop $RELEASE_VERSION" \
            --notes "Tauri-Updatepakete mit kostenlosem Signaturschlüssel; keine Betriebssystem-Signaturen, daher können SmartScreen/Gatekeeper warnen."
      - name: Publish update manifest last (atomic channel switch)
        shell: bash
        run: |
          set -euo pipefail
          feed=desktop-update-feed
          if gh release view "$feed" >/dev/null 2>&1; then
            gh release upload "$feed" release/latest.json --clobber
          else
            gh release create "$feed" release/latest.json \
              --title "Abbate Desktop Update Feed" \
              --notes "Automatischer Update-Kanal; bitte den Feed nicht manuell verändern." \
              --prerelease --target "$GITHUB_SHA"
          fi
          gh release download "$feed" --pattern latest.json --dir "$RUNNER_TEMP/feed-check" --clobber
          cmp -s release/latest.json "$RUNNER_TEMP/feed-check/latest.json"
      - name: Offer only verified release installers on download site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B stable-download-links origin/main
          node - <<'NODE'
          const fs=require('fs');
          const p='downloads.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          const base='https://github.com/'+process.env.GH_REPO+'/releases/download/desktop-v'+process.env.RELEASE_VERSION+'/';
          j.windows=base+'Abbate-Lernraum-Windows-Setup.exe';
          j.macos=base+'Abbate-Lernraum-macOS-Universal.dmg';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          if ! git diff --cached --quiet; then
            git commit -m "Release verified update-capable desktop v$RELEASE_VERSION"
            git push origin HEAD:main
          fi

name: Desktop pilot installers

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "dist/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            build_args: "--bundles nsis"
          - os: macos-15
            platform: macos-universal
            build_args: "--bundles dmg --target universal-apple-darwin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install both Mac architecture targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install frontend dependencies
        run: npm ci
      - name: Run existing application tests
        run: npm test
      - name: Create desktop icons from the Abbate app icon
        run: npx --yes @tauri-apps/cli@2.12.4 icon dist/icon-512.png --output src-tauri/icons
      - name: Build platform-specific installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.build_args }} --ci
      - name: Upload installers for internal testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abbate-${{ matrix.platform }}-pilot-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

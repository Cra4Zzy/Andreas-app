name: Desktop pilot installers

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "dist/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            build_args: "--bundles nsis"
          - os: macos-15
            platform: macos-universal
            build_args: "--bundles dmg --target universal-apple-darwin"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install both Mac architecture targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install frontend dependencies
        run: npm ci
      - name: Run existing application tests
        run: npm test
      - name: Create desktop icons from the Abbate app icon
        run: npx --yes @tauri-apps/cli@2.12.4 icon dist/icon-512.png --output src-tauri/icons
      - name: Build platform-specific installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.build_args }} --ci
      - name: Upload installers for internal testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: abbate-${{ matrix.platform }}-pilot-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish_desktop_previews:
    name: Publish Windows and Mac test installers
    needs: desktop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch Windows installer
        uses: actions/download-artifact@v4
        with:
          name: abbate-windows-x64-pilot-installer
          path: windows-artifact
      - name: Fetch universal Mac installer
        uses: actions/download-artifact@v4
        with:
          name: abbate-macos-universal-pilot-installer
          path: macos-artifact
      - name: Prepare stable asset names
        shell: bash
        run: |
          set -euo pipefail
          win="$(find windows-artifact -type f -name '*.exe' -print -quit)"
          mac="$(find macos-artifact -type f -name '*.dmg' -print -quit)"
          test -s "$win"
          test -s "$mac"
          mkdir -p release
          cp "$win" release/Abbate-Lernraum-Windows-Setup.exe
          cp "$mac" release/Abbate-Lernraum-macOS-Universal.dmg
      - name: Publish pilot assets to durable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="desktop-pilot"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/Abbate-Lernraum-Windows-Setup.exe release/Abbate-Lernraum-macOS-Universal.dmg --clobber
          else
            gh release create "$tag" release/Abbate-Lernraum-Windows-Setup.exe release/Abbate-Lernraum-macOS-Universal.dmg \
              --target "$GITHUB_SHA" \
              --title "Abbate Lernraum – Desktop-Testversionen" \
              --notes "Interne Testversionen – noch nicht produktiv freigegeben. Windows ist nicht code-signiert. Mac ist nicht Developer-ID-signiert oder notarisiert und kann von Gatekeeper blockiert werden." \
              --prerelease
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx 'Abbate-Lernraum-Windows-Setup.exe'
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx 'Abbate-Lernraum-macOS-Universal.dmg'
      - name: Enable only the verified pilot downloads on the landing page
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B release-download-links origin/main
          node -e "const fs=require('fs');const f='downloads.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));const b='https://github.com/'+process.env.GH_REPO+'/releases/download/desktop-pilot/';j.windowsPreview=b+'Abbate-Lernraum-Windows-Setup.exe';j.macosPreview=b+'Abbate-Lernraum-macOS-Universal.dmg';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          if ! git diff --cached --quiet; then
            git commit -m "Expose verified desktop test downloads"
            git push origin HEAD:main
          fi
